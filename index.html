<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEMEXAM</title>
<style>
:root{--bg:#050505;--panel:#0d0d0d;--panel2:#121212;--gold:#d4af37;--gold2:#f2d77b;--muted:#9b9b9b;--line:rgba(212,175,55,.35);--danger:#e35d6a;--ok:#5bd39a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191919 0,#050505 42%,#000 100%);color:#f5f5f5;font-family:Arial,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}.hidden{display:none!important}.gold{color:var(--gold)}.muted{color:var(--muted)}
.screen{min-height:100vh;padding:28px}.center{display:grid;place-items:center}
.card{background:linear-gradient(145deg,rgba(20,20,20,.96),rgba(7,7,7,.96));border:1px solid var(--line);box-shadow:0 20px 70px rgba(0,0,0,.55),inset 0 0 30px rgba(212,175,55,.035);border-radius:24px}
.btn{border:1px solid var(--gold);background:linear-gradient(135deg,#d4af37,#9f7c1d);color:#090909;padding:13px 22px;border-radius:13px;font-weight:800;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.secondary{background:#0d0d0d;color:var(--gold)}.btn.danger{border-color:#a93d49;background:#2b0d11;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.home{background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.2)),url('assets/school.jpg') center/cover no-repeat fixed;position:relative}
.home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.45))}
.home .hero{position:relative;z-index:1;min-height:calc(100vh - 56px);display:grid;place-items:center}
.login{width:min(430px,90vw);padding:26px}.brand{letter-spacing:5px;font-size:14px;color:var(--gold);text-align:center}.title{font-size:clamp(30px,5vw,54px);font-weight:900;text-align:center;margin:10px 0}.subtitle{text-align:center;color:#c7c7c7;margin-bottom:28px}
.field{margin:14px 0}.field label{display:block;color:var(--gold2);font-size:13px;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #3b331e;background:#090909;color:#fff;outline:none}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.1)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.tiny{font-size:11px;color:#777;text-align:center;margin-top:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1200px;margin:0 auto 18px}.logo{font-weight:900;letter-spacing:3px;color:var(--gold)}.pill{border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:#0b0b0b;color:#ddd}
.wrap{max-width:1200px;margin:auto}.pageTitle{font-size:34px;font-weight:900;margin:24px 0 6px}.pageSub{color:var(--muted);margin-bottom:20px}
.langGrid,.subjectGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.langCard,.subjectCard{padding:28px;cursor:pointer;transition:.2s}.langCard:hover,.subjectCard:hover{transform:translateY(-3px);border-color:var(--gold)}.langCard.selected,.subjectCard.selected{outline:2px solid var(--gold);background:linear-gradient(145deg,#17130a,#090909)}
.langIcon{font-size:38px}.langName{font-size:24px;font-weight:900;margin:12px 0}.subjectList{display:grid;gap:10px}.subjectItem{display:flex;align-items:center;gap:14px;padding:15px 17px;background:#0b0b0b;border:1px solid #2d2819;border-radius:14px;cursor:grab}.handle{color:var(--gold);font-size:20px}.orderNo{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold)}
.examGrid{display:grid;grid-template-columns:250px 1fr;gap:18px}.side{padding:16px;position:sticky;top:16px;height:max-content}.timer{font-size:36px;font-weight:900;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}.timer.warn{color:#ff9c4a}.qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:16px}.qnum{background:#101010;color:#aaa;border:1px solid #2c281b;padding:8px 0;border-radius:9px;cursor:pointer}.qnum.active{border-color:var(--gold);color:#fff}.qnum.done{background:#2a2310;color:var(--gold2)}.mainExam{padding:24px}.examHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.subjectTag{color:var(--gold);font-weight:900}.qtext{font-size:23px;line-height:1.8;margin:12px 0 22px}.qimage{max-width:100%;max-height:540px;display:block;margin:0 auto 18px;border-radius:12px;border:1px solid var(--line);background:#eee}.options{display:grid;gap:11px}.option{padding:15px;border:1px solid #36301e;border-radius:13px;background:#0b0b0b;cursor:pointer;display:flex;gap:12px;align-items:flex-start}.option:hover{border-color:#8e7427}.option.selected{border-color:var(--gold);background:rgba(212,175,55,.08);box-shadow:inset 0 0 0 1px rgba(212,175,55,.25)}.letter{min-width:32px;height:32px;border-radius:9px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:900}.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.progress{height:6px;background:#191919;border-radius:99px;overflow:hidden;margin:0 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#9f7c1d,#f2d77b);transition:.2s}
.resultGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.scoreCard{padding:20px;text-align:center}.score{font-size:34px;color:var(--gold);font-weight:900}.total{padding:30px;text-align:center;margin-top:16px}.total .score{font-size:58px}.adminTable{width:100%;border-collapse:collapse;overflow:hidden;border-radius:14px}.adminTable th,.adminTable td{padding:11px;border-bottom:1px solid #2b2619;text-align:center}.adminTable th{color:var(--gold);background:#0c0c0c}.adminTools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.notice{padding:13px 15px;border:1px solid #493c1c;background:#171309;color:#d8c88d;border-radius:12px;margin:14px 0}
@media(max-width:850px){.examGrid{grid-template-columns:1fr}.side{position:static}.langGrid,.subjectGrid,.resultGrid{grid-template-columns:1fr 1fr}.qtext{font-size:19px}}@media(max-width:560px){.screen{padding:14px}.login{padding:24px}.resultGrid,.langGrid,.subjectGrid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.examHead{align-items:flex-start;flex-direction:column}.qnav{grid-template-columns:repeat(8,1fr)}}

.dragging{opacity:.45}.miniMove{margin-inline-start:auto;background:#0b0b0b;color:#d4af37;border:1px solid #3b331e;border-radius:8px;padding:5px 8px;cursor:pointer}.miniMove+.miniMove{margin-inline-start:0}.iqLayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,360px);gap:22px;align-items:start}.iqVisual{border:1px solid var(--line);border-radius:16px;background:#080808;padding:12px;position:sticky;top:15px}.visualLabel{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:9px}.iqVisual .qimage{max-height:420px;width:100%;object-fit:contain}.sideQuestionImage{max-width:360px;margin:0 auto 18px}.subjectItem{flex-wrap:wrap}.subjectItem b{min-width:90px}@media(max-width:850px){.iqLayout{grid-template-columns:1fr}.iqVisual{position:static}}

.optionsVisual{margin:0 0 16px}.optionGridImage{max-width:520px;width:100%;margin:0 auto;display:block}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"math_ar":[{"id":1,"source_num":1,"question":"إذا كانت د دالة تحقق د(س) + 2 د(1 - س) = 3س لجميع قيم س الحقيقية، فإن قيمة د(2) تساوي:","options":["-4","2","6","-2"],"answer":"A"},{"id":1,"source_num":2,"question":"إذا كان س + ص + س ص = 11 ، س^2 ص + س ص^2 = 30 ، فإن قيمة س^2 + ص^2 يمكن أن تساوي:","options":["13","26","13 أو 26","31"],"answer":"C"},{"id":2,"source_num":3,"question":"المقدار جذر(7 + 4جذر3) - جذر(7 - 4جذر3) يساوي:","options":["2","2 جذر 3","4","جذر 3"],"answer":"B"},{"id":3,"source_num":4,"question":"مجموع مكعبات جذور المعادلة س^3 - 6س^2 + 11س - 6 = 0 يساوي:","options":["36","216","18","54"],"answer":"A"},{"id":4,"source_num":5,"question":"عدد أزواج الأعداد الصحيحة الموجبة (س ، ص) التي تحقق المعادلة 1/س + 1/ص = 1/6 هو:","options":["5","9","7","18"],"answer":"B"},{"id":5,"source_num":6,"question":"إذا كان س^س = 2^2048 ، فإن قيمة س تساوي:","options":["128","256","512","1024"],"answer":"B"},{"id":6,"source_num":7,"question":"عدد الحلول الصحيحة للمعادلة |س - 1| + |س - 5| = 4 هو:","options":["2","4","5","عدد لا نهائي"],"answer":"C"},{"id":7,"source_num":8,"question":"إذا كان (س + ص - ع) / ع = (س - ص + ع) / ص = (-س + ص + ع) / س = ك ، فإن القيمة الممكنة للثابت ك هي:","options":["1 فقط","-2 فقط","1 أو -2","0"],"answer":"C"},{"id":8,"source_num":9,"question":"القيمة الصغرى للمقدار س^2 + ص^2 - 4س + 6ص + 25 هي:","options":["25","12","0","13"],"answer":"B"},{"id":9,"source_num":10,"question":"إذا كان أ + ب + جـ = 0 ، فإن قيمة المقدار (أ^3 + ب^3 + جـ^3) / (أ ب جـ) تساوي:","options":["0","1","3","-3"],"answer":"C"},{"id":10,"source_num":11,"question":"إذا كان 2^س = 5^ص = 100^ع ، فإن قيمة المقدار 2/س + 2/ص - 1/ع تساوي:","options":["0","1","2","-1"],"answer":"A"},{"id":11,"source_num":12,"question":"باقي قسمة الكثير الحدود س^100 - 1 على (س^2 - 3س + 2) هو:","options":["(2^100 - 1)(س - 1)","2^100 س - 1","0","2^100 (س - 2)"],"answer":"A"},{"id":12,"source_num":13,"question":"أكبر قيمة ممكنة للقاسم المشترك الأكبر للعددين (ن^2 + 1) و (ن + 1) حيث ن عدد صحيح هي:","options":["1","2","ن","ن + 1"],"answer":"B"},{"id":13,"source_num":14,"question":"القيمة الصغرى للمقدار س + 9/س عندما س > 0 هي:","options":["3","6","9","12"],"answer":"B"},{"id":14,"source_num":15,"question":"عدد الأعداد الصحيحة س التي تحقق المعادلة جذر(س + 3 - 4جذر(س - 1)) + جذر(س + 8 - 6جذر(س - 1)) = 1 هو:","options":["1","5","6","10"],"answer":"C"},{"id":15,"source_num":16,"question":"إذا كان أ/ب = ب/جـ = جـ/د = 2 ، فإن قيمة المقدار (أ + 2ب + 3جـ) / (ب + 2جـ + 3د) تساوي:","options":["2","4","8","6"],"answer":"A"},{"id":16,"source_num":17,"question":"إذا كانت س^2 + 1/س^2 = 7 حيث س > 0 ، فإن قيمة س^3 + 1/س^3 تساوي:","options":["18","27","36","14"],"answer":"A"},{"id":17,"source_num":18,"question":"كم عدد الأعداد الصحيحة ك التي تجعل للمعادلة س^2 - ك س + 12 = 0 جذوراً صحيحة فقط؟","options":["4","6","12","8"],"answer":"D"},{"id":18,"source_num":19,"question":"إذا كانت د(س) دالة فردية وكانت د(2) = 5 ، فإن قيمة د(-2) + د(0) تساوي:","options":["5","-5","0","10"],"answer":"B"},{"id":19,"source_num":20,"question":"إذا كان أ ب جـ د مستطيلاً وكانت نقطة م بداخله بحيث م أ = 3 سم ، م ب = 4 سم ، م جـ = 5 سم ، فإن طول م د يساوي:","options":["3 جذر 2 سم","جذر 18 سم","3 سم","جذر 32 سم"],"answer":"A"},{"id":20,"source_num":21,"question":"في المثلث القائم الزاوية، إذا كان نصف قطر الدائرة الداخليّة المماسة لأضلاعه r = 2 سم، ونصف قطر الدائرة الخارجة R = 6.5 سم، فإن محيط المثلث يساوي:","options":["30 سم","26 سم","28 سم","32 سم"],"answer":"A"},{"id":21,"source_num":22,"question":"قاطعان للدائرة رُسما من نقطة ب خارجها؛ الأول يقطع الدائرة في س ، ص حيث ب س = 4 سم ، س ص = 5 سم، والثاني يقطع الدائرة في ع ، ل حيث ب ع = 3 سم. طول ع ل يساوي:","options":["9 سم","12 سم","15 سم","6 سم"],"answer":"A"},{"id":22,"source_num":23,"question":"مثلث قائم الزاوية طولا ضلعي القائمة فيه 6 سم و 8 سم. طول نصف قطر الدائرة المماسة لأضلاعه الداخليّة يساوي:","options":["2 سم","3 سم","4 سم","1.5 سم"],"answer":"A"},{"id":23,"source_num":24,"question":"في المثلث أ ب جـ ، النقطة د تقع على ب جـ بحيث ب د : د جـ = 2 : 3 ، والنقطة هـ تقع على أ د بحيث أ هـ : هـ د = 1 : 2. نسبة مساحة المثلث أ ب هـ إلى مساحة المثلث أ ب جـ تساوي:","options":["2 / 15","1 / 5","3 / 10","1 / 6"],"answer":"A"},{"id":24,"source_num":25,"question":"في المثلث متساوي الساقين أ ب جـ فيه أ ب = أ جـ ، قياس زاوية أ = 100°. النقطة د داخل المثلث بحيث قياس زاوية د ب جـ = 30° وقياس زاوية د جـ ب = 20°. قياس زاوية أ د جـ يساوي:","options":["80°","90°","100°","110°"],"answer":"A"}],"math_en":[{"id":1,"source_num":1,"question":"If f is a function satisfying f(x) + 2f(1 - x) = 3x for all real numbers x, then the value of f(2) is:","options":["-4","2","6","-2"],"answer":"A"},{"id":2,"source_num":2,"question":"If x + y + xy = 11 and x^2 y + x y^2 = 30, then the value of x^2 + y^2 can be equal to:","options":["13","26","13 or 26","31"],"answer":"C"},{"id":3,"source_num":3,"question":"The value of sqrt(7 + 4 sqrt(3)) - sqrt(7 - 4 sqrt(3)) is:","options":["2","2 sqrt(3)","4","sqrt(3)"],"answer":"B"},{"id":4,"source_num":4,"question":"The sum of the cubes of the roots of the equation x^3 - 6x^2 + 11x - 6 = 0 is:","options":["36","216","18","54"],"answer":"A"},{"id":5,"source_num":5,"question":"The number of positive integer pairs (x, y) satisfying the equation 1/x + 1/y = 1/6 is:","options":["5","9","7","18"],"answer":"B"},{"id":6,"source_num":6,"question":"If x^x = 2^2048, then the value of x is:","options":["128","256","512","1024"],"answer":"B"},{"id":7,"source_num":7,"question":"The number of integer solutions to the equation |x - 1| + |x - 5| = 4 is:","options":["2","4","5","Infinitely many"],"answer":"C"},{"id":8,"source_num":8,"question":"If (x + y - z) / z = (x - y + z) / y = (-x + y + z) / x = k, then the possible value(s) of the constant k is/are:","options":["1 only","-2 only","1 or -2","0"],"answer":"C"},{"id":9,"source_num":9,"question":"The minimum value of the expression x^2 + y^2 - 4x + 6y + 25 is:","options":["25","12","0","13"],"answer":"B"},{"id":10,"source_num":10,"question":"If a + b + c = 0, then the value of (a^3 + b^3 + c^3) / (a b c) is:","options":["0","1","3","-3"],"answer":"C"},{"id":11,"source_num":11,"question":"If 2^x = 5^y = 100^z, then the value of 2/x + 2/y - 1/z is:","options":["0","1","2","-1"],"answer":"A"},{"id":12,"source_num":12,"question":"The remainder when the polynomial x^100 - 1 is divided by (x^2 - 3x + 2) is:","options":["(2^100 - 1)(x - 1)","2^100 x - 1","0","2^100 (x - 2)"],"answer":"A"},{"id":13,"source_num":13,"question":"The maximum possible greatest common divisor (GCD) of (n^2 + 1) and (n + 1) for an integer n is:","options":["1","2","n","n + 1"],"answer":"B"},{"id":14,"source_num":14,"question":"The minimum value of x + 9/x for x > 0 is:","options":["3","6","9","12"],"answer":"B"},{"id":15,"source_num":15,"question":"The number of integers x satisfying sqrt(x + 3 - 4 sqrt(x - 1)) + sqrt(x + 8 - 6 sqrt(x - 1)) = 1 is:","options":["1","5","6","10"],"answer":"C"},{"id":16,"source_num":16,"question":"If a/b = b/c = c/d = 2, then the value of (a + 2b + 3c) / (b + 2c + 3d) is:","options":["2","4","8","6"],"answer":"A"},{"id":17,"source_num":17,"question":"If x^2 + 1/x^2 = 7 for x > 0, then the value of x^3 + 1/x^3 is:","options":["18","27","36","14"],"answer":"A"},{"id":18,"source_num":18,"question":"How many integer values of k exist such that the equation x^2 - kx + 12 = 0 has only integer roots?","options":["4","6","12","8"],"answer":"D"},{"id":19,"source_num":19,"question":"If f(x) is an odd function and f(2) = 5, then the value of f(-2) + f(0) is:","options":["5","-5","0","10"],"answer":"B"},{"id":20,"source_num":20,"question":"In a rectangle ABCD, point P lies inside such that PA = 3 cm, PB = 4 cm, and PC = 5 cm. The length of PD is:","options":["3 sqrt(2) cm","sqrt(18) cm","3 cm","sqrt(32) cm"],"answer":"A"},{"id":21,"source_num":21,"question":"In a right-angled triangle, if the inradius r = 2 cm and the circumradius R = 6.5 cm, then the perimeter of the triangle is:","options":["30 cm","26 cm","28 cm","32 cm"],"answer":"A"},{"id":22,"source_num":22,"question":"Two secants are drawn to a circle from an external point P. The first cuts the circle at A and B with PA = 4 cm and AB = 5 cm. The second cuts it at C and D with PC = 3 cm. The length of CD is:","options":["9 cm","12 cm","15 cm","6 cm"],"answer":"A"},{"id":23,"source_num":23,"question":"A right-angled triangle has legs of length 6 cm and 8 cm. The radius of its incircle is:","options":["2 cm","3 cm","4 cm","1.5 cm"],"answer":"A"},{"id":24,"source_num":24,"question":"In triangle ABC, point D lies on BC such that BD : DC = 2 : 3, and point E lies on AD such that AE : ED = 1 : 2. The ratio of the area of triangle ABE to the area of triangle ABC is:","options":["2 / 15","1 / 5","3 / 10","1 / 6"],"answer":"A"},{"id":25,"source_num":25,"question":"In an isosceles triangle ABC with AB = AC and angle A = 100 deg, point D inside the triangle satisfies angle DBC = 30 deg and angle DCB = 20 deg. The measure of angle ADC is:","options":["80 deg","90 deg","100 deg","110 deg"],"answer":"A"}],"science_ar":[{"id":1,"source_num":1,"question":"يتحرك جسم من السكون بعجلة منتظمة a1 لفترة زمنية t1، ثم يتحرك بعجلة تقصيرية منتظمة a2 لفترة t2 حتى يقف تماماً. إذا كانت المسافة الكلية المقطوعة D، فإن أقصى سرعة وصل إليها الجسم (v_max) تساوي:","options":["جذر(2 a1 a2 D / (a1 + a2))","(a1 + a2) D / (a1 a2)","جذر(a1 a2 D)","2 D / (t1 - t2)"],"answer":"A"},{"id":2,"source_num":2,"question":"يتحرك جسم في مسار مستقيم، حيث قطع الثلث الأول من المسافة الكلية بسرعة v1، والثلثين الباقيين بسرعة v2. السرعة المتوسطة للجسم خلال الرحلة كاملة هي:","options":["(v1 + 2v2) / 3","(3 v1 v2) / (2v1 + v2)","(3 v1 v2) / (v2 + 2v1)","(2 v1 v2) / (v1 + v2)"],"answer":"B"},{"id":3,"source_num":3,"question":"مرآة مقعرة بعدها البؤري f. تحرك جسم مقترباً من المرآة بسرعة منتظمة v نحو البؤرة. تتطابق سرعة الصورة مع سرعة الجسم لحظياً عندما يكون الجسم على بعد:","options":["f","1.5 f","2 f","3 f"],"answer":"C"},{"id":4,"source_num":4,"question":"وضع جسم على بعد 15 سم من عدسة محدبة بعدها البؤري 10 سم. خلف العدسة وعلى بعد 20 سم منها وضعت مرآة مستوية عمودية على المحور الأصلي. الصورة النهائية المتكونة بواسطة المرآة تقع على بعد كم سم من العدسة؟","options":["10 سم خلف العدسة","10 سم أمام العدسة","30 سم خلف العدسة","تنطبق على الجسم تماماً"],"answer":"A"},{"id":5,"source_num":5,"question":"شعاع ضوئي يسقط على مرآة مستوية M1. إذا أُديرت المرآة بزاوية مقدارها θ حول محور عمودي على مستوى السقوط، فإن الشعاع المنعكس يدور بزاوية مقدارها:","options":["θ","2 θ","θ / 2","90° - θ"],"answer":"B"},{"id":6,"source_num":6,"question":"شبكة كهربائية على شكل هيكل مكعب، يتكون كل ضلع فيه من مقاومة قيمة كل منها R. المقاومة المكافئة بين طرفي قطري المكعب المتقابلين كلياً تساوي:","options":["(5 / 6) R","(6 / 5) R","1 R","(3 / 4) R"],"answer":"A"},{"id":7,"source_num":7,"question":"ثلاث لمبات متماثلة متصلة كما يلي: اللمبة A متصلة على التوالي مع جُزء يحتوي على اللمبتين B و C المتصلتين معاً على التوازي، والجميع متصل ببطارية مهملة المقاومة الداخلية. إذا احترقت اللمبة C، فإن إضاءة اللمبة A واللمبة B على الترتيب:","options":["تزداد A، وتقل B","تقل A، وتزداد B","تقل A، وتقل B","تزداد A، وتزداد B"],"answer":"B"},{"id":8,"source_num":8,"question":"دائرة كهربائية تحتوي على مصباح ومقاومة متغيرة (ريوستات) وبطارية. إذا تم توصيل فولتميتر بين قطبي البطارية، وآخر بين طرفي المصباح. عند زيادة قيمة مقاومة الريوستات، فإن قراءة الفولتميترين على الترتيب:","options":["تزداد الأولى، وتقل الثانية","تقل الأولى، وتزداد الثانية","تظل الأولى ثابتة (إذا كانت البطارية مثالية) وتزداد الثانية","تظل الأولى ثابتة (بطارية مثالية) وتقل الثانية"],"answer":"D"},{"id":9,"source_num":9,"question":"سلك منتظم المقطع مقاومته R تم تشكيله على هيئة حلقة دائرة مغلقة. تم توصيل مصدر كهربائي بين نقطتين على قطر هذه الدائرة. المقاومة المكافئة بين النقطتين تكون:","options":["R","R / 2","R / 4","R / 8"],"answer":"C"},{"id":10,"source_num":10,"question":"عدستان محدبتان ملاصقتان لبعضهما البعض، البعد البؤري للأولى f1 = +20 cm والثانية f2 = -10 cm (عدسة مقعرة). البعد البؤري للمجموعة المكافئة وطبيعتها هما:","options":["-20 cm (مجمعة)","-20 cm (مفرقة)","+20 cm (مجمعة)","+10 cm (مفرقة)"],"answer":"B"},{"id":11,"source_num":11,"question":"يتحرك جسم في مسار دائري منتظم بنصف قطر R وبسرعة مماسية v. إذا تضاعفت السرعة المماسية وقل نصف القطر إلى النصف، فإن العجلة المركزية (a = v^2 / R) تزداد بمقدار:","options":["2 مرة","4 مرات","8 مرات","16 مرة"],"answer":"C"},{"id":12,"source_num":12,"question":"محول كهربائي كفاءته 100%، عدد لفات ملفه الابتدائي N1 وعدد لفات ملفه الثانوي N2 = 2 N1. إذا وصل الملف الابتدائي ببطارية مستمرة جهدها 12V، فإن جهد الملف الثانوي يساوي:","options":["24V","12V","6V","صفر V"],"answer":"D"},{"id":13,"source_num":13,"question":"سقط شعاع ضوئي عمودياً على أحد وجهي منشور ثلاثي زاوية رأسه 30° وزاوية انحراف الشعاع عند خروجه 15°. تكون زاوية خروج الشعاع من الوجه الآخر هي:","options":["15°","30°","45°","60°"],"answer":"C"},{"id":14,"source_num":14,"question":"موصلان A و B من نفس المادة، طول A ضعف طول B ونصف قطر A نصف نصف قطر B. النسبة بين مقاومة A إلى مقاومة B (RA : RB) هي:","options":["1 : 2","2 : 1","8 : 1","1 : 8"],"answer":"C"},{"id":15,"source_num":15,"question":"يُطلق مقذوف بزاوية 45° مع الأفقي بسرعة ابتدائية v. عند أقصى ارتفاع يصله المقذوف، تكون سرعته وقيمة العجلة المؤثرة عليه على الترتيب:","options":["صفر، صفر","v / جذر(2) ، عجلة الجاذبية g","v ، صفر","v / 2 ، g / 2"],"answer":"B"},{"id":16,"source_num":16,"question":"عند استخدام مرآة مقعرة لتكوين صورة على حائل لجسم بعيد جداً (كالشرائح الشديدة البعد)، إذا تم تغطية النصف السفلي للمرآة بشريط لاصق أسود غير شفاف:","options":["يختفي النصف السفلي من الصورة","يختفي النصف العلوي من الصورة","تظل الصورة كاملة ولكن تقل شدة إضاءتها للنصف","تتشوه الصورة وتصبح غير واضحة"],"answer":"C"},{"id":17,"source_num":17,"question":"جسم كتلته m يتحرك بسرعة v فتكون طاقته الحركة K. إذا زادت كتلته بنسبة 100% وقلت سرعته بنسبة 50%، فإن طاقة الحركة الجديدة تصبح:","options":["K","0.5 K","2 K","0.25 K"],"answer":"B"},{"id":18,"source_num":18,"question":"ثلاث مقاومات (1 أوم، 2 أوم، 3 أوم) وصلت معاً بمصدر تيار كهربي، وكانت شدة التيار المار في كل منها (0.3A ، 0.15A ، 0.15A) على الترتيب. المقاومة المكافئة للدائرة تساوي:","options":["2 أوم","1.5 أوم","2.2 أوم","6 أوم"],"answer":"C"},{"id":19,"source_num":19,"question":"عند انكسار الضوء أثناء انتقاله من الوسط الأقل كثافة ضوئية إلى الوسط الأكبر كثافة ضوئية، فإن الخاصية الفيزيائية للضوء التي لا تتغير مطلقاً هي:","options":["السرعة","الطول الموجي","التردد","اتجاه الانتشار"],"answer":"C"},{"id":20,"source_num":20,"question":"سلك مقاومته R تم ضغطه بانتظام بحيث نقص طوله إلى النصف مع ثبات كتلته وكثافته. المقاومة الجديدة للسلك تصبح:","options":["R / 2","R / 4","2 R","4 R"],"answer":"B"},{"id":21,"source_num":21,"question":"التوزيع الإلكتروني لأيون العنصر X في المركب X2O3 هو [18Ar]. يقع هذا العنصر في الدورة والمجموعة:","options":["الدورة 3، المجموعة 3A","الدورة 4، المجموعة 3B","الدورة 4، المجموعة 3A","الدورة 3، المجموعة 5A"],"answer":"C"},{"id":22,"source_num":22,"question":"في التفاعل الكيميائي الموزون: 2KMnO4 + 16HCl -> 2KCl + 2MnCl2 + 8H2O + 5Cl2. عدد مولات الإلكترونات المفقودة بواسطة العامل المختزل لأكسدة الكلور كلياً لإنتاج 5 مول من Cl2 هو:","options":["5 مول إلكترونات","10 مول إلكترونات","16 مول إلكترونات","2 مول إلكترونات"],"answer":"B"},{"id":23,"source_num":23,"question":"عند إضافة كمية فائضة من الخارصين (Zn) إلى خليط مائي يحتوي على 1 مول من AgNO3 و1 مول من Cu(NO3)2، الترتيب الصحيح لترسيب الفلزات هو:","options":["يترسب Cu أولاً بالكامل ثم Ag","يترسب Ag أولاً بالكامل ثم Cu","يترسبان معاً بنفس المعدل","يتفاعل الخارصين مع النيترات ولا يترسب شيء"],"answer":"B"},{"id":24,"source_num":24,"question":"تسخين 10 جرام من كربونات الكالسيوم غير النقية CaCO3 أدّى لإنطلاق 2.2 جرام من غاز ثاني أكسيد الكربون (المولار لـ CaCO3 = 100g/mol ولـ CO2 = 44g/mol). نسبة نقاء كربونات الكالسيوم في العينة هي:","options":["22%","44%","50%","100%"],"answer":"C"},{"id":25,"source_num":25,"question":"في تفاعل انحلال مركب فوق أكسيد الهيدروجين (2H2O2 -> 2H2O + O2)، يمثل مركب H2O2 دور:","options":["عامل مؤكسد فقط","عامل مختزل فقط","عامل مؤكسد وعامل مختزل في نفس الوقت (أكسدة واختزال ذاتي)","عامل حفاز"],"answer":"C"}],"science_en":[{"id":1,"source_num":1,"question":"A body starts from rest with uniform acceleration a1 for time t1, then moves with uniform deceleration a2 for time t2 until it completely stops. If the total distance covered is D, the maximum velocity reached by the body (v_max) is:","options":["sqrt(2 a1 a2 D / (a1 + a2))","(a1 + a2) D / (a1 a2)","sqrt(a1 a2 D)","2 D / (t1 - t2)"],"answer":"A"},{"id":2,"source_num":2,"question":"A body moves along a straight path covering the first third of the total distance at speed v1, and the remaining two-thirds at speed v2. The average speed of the body during the entire trip is:","options":["(v1 + 2v2) / 3","(3 v1 v2) / (2v1 + v2)","(3 v1 v2) / (v2 + 2v1)","(2 v1 v2) / (v1 + v2)"],"answer":"B"},{"id":3,"source_num":3,"question":"A concave mirror has a focal length f. An object moves towards the mirror with a constant speed v towards the focus. The instantaneous speed of the image equals the speed of the object when the object is at a distance of:","options":["f","1.5 f","2 f","3 f"],"answer":"C"},{"id":4,"source_num":4,"question":"An object is placed 15 cm in front of a convex lens of focal length 10 cm. Behind the lens and at a distance of 20 cm from it, a plane mirror is placed perpendicular to the principal axis. The final image formed by the mirror is located at a distance of:","options":["10 cm behind the lens","10 cm in front of the lens","30 cm behind the lens","Exactly coinciding with the object"],"answer":"A"},{"id":5,"source_num":5,"question":"A light ray falls on a plane mirror M1. If the mirror is rotated by an angle θ about an axis perpendicular to the plane of incidence, the reflected ray rotates by an angle of:","options":["θ","2 θ","θ / 2","90° - θ"],"answer":"B"},{"id":6,"source_num":6,"question":"An electrical network in the shape of a cube frame consists of resistors on each edge, each of resistance R. The equivalent resistance between two diagonally opposite vertices of the cube is:","options":["(5 / 6) R","(6 / 5) R","1 R","(3 / 4) R"],"answer":"A"},{"id":7,"source_num":7,"question":"Three identical bulbs are connected as follows: Bulb A is in series with a parallel combination of Bulbs B and C, connected to a battery with negligible internal resistance. If Bulb C burns out, the brightness of Bulbs A and B respectively will:","options":["Increase A, Decrease B","Decrease A, Increase B","Decrease A, Decrease B","Increase A, Increase B"],"answer":"B"},{"id":8,"source_num":8,"question":"A circuit contains a lamp, a rheostat, and an ideal battery. One voltmeter is connected across the battery terminals, and another across the lamp. If the resistance of the rheostat is increased, the readings of the two voltmeters respectively:","options":["First increases, second decreases","First decreases, second increases","First remains constant, second increases","First remains constant, second decreases"],"answer":"D"},{"id":9,"source_num":9,"question":"A uniform wire of resistance R is bent into a closed circular ring. A power supply is connected across two diametrically opposite points. The equivalent resistance between the two points is:","options":["R","R / 2","R / 4","R / 8"],"answer":"C"},{"id":10,"source_num":10,"question":"Two thin lenses in contact have focal lengths f1 = +20 cm and f2 = -10 cm (concave lens). The focal length and nature of the equivalent combination are:","options":["-20 cm (converging)","-20 cm (diverging)","+20 cm (converging)","+10 cm (diverging)"],"answer":"B"},{"id":11,"source_num":11,"question":"A body moves in a uniform circular path of radius R with tangential velocity v. If the tangential speed is doubled and the radius is halved, the centripetal acceleration (a = v^2 / R) increases by a factor of:","options":["2","4","8","16"],"answer":"C"},{"id":12,"source_num":12,"question":"A 100% efficient transformer has primary turns N1 and secondary turns N2 = 2 N1. If the primary coil is connected to a DC battery of 12V, the secondary output voltage will be:","options":["24V","12V","6V","0V"],"answer":"D"},{"id":13,"source_num":13,"question":"A light ray falls perpendicularly on one face of a triangular prism with apex angle 30°. If the angle of deviation upon emergence is 15°, the angle of emergence from the opposite face is:","options":["15°","30°","45°","60°"],"answer":"C"},{"id":14,"source_num":14,"question":"Two conductors A and B are made of the same material. The length of A is double that of B, and the radius of A is half the radius of B. The ratio of the resistance of A to B (RA : RB) is:","options":["1 : 2","2 : 1","8 : 1","1 : 8"],"answer":"C"},{"id":15,"source_num":15,"question":"A projectile is launched at an angle of 45° to the horizontal with initial speed v. At its maximum height, its velocity and the acting acceleration respectively are:","options":["0, 0","v / sqrt(2) , gravitational acceleration g","v , 0","v / 2 , g / 2"],"answer":"B"},{"id":16,"source_num":16,"question":"When using a concave mirror to form an image of a very distant object on a screen, if the lower half of the mirror is covered with an opaque black tape:","options":["The lower half of the image disappears","The upper half of the image disappears","The image remains complete, but its brightness reduces by half","The image becomes distorted and blurry"],"answer":"C"},{"id":17,"source_num":17,"question":"A body of mass m moves with speed v having kinetic energy K. If its mass increases by 100% and its speed decreases by 50%, the new kinetic energy becomes:","options":["K","0.5 K","2 K","0.25 K"],"answer":"B"},{"id":18,"source_num":18,"question":"Three resistors (1 Ω, 2 Ω, 3 Ω) are connected to a power supply. The currents flowing through them are 0.3 A, 0.15 A, and 0.15 A respectively. The equivalent resistance of the circuit is:","options":["2 Ω","1.5 Ω","2.2 Ω","6 Ω"],"answer":"C"},{"id":19,"source_num":19,"question":"When light refracts upon traveling from an optically rarer medium to an optically denser medium, the physical property of light that NEVER changes is:","options":["Speed","Wavelength","Frequency","Direction of propagation"],"answer":"C"},{"id":20,"source_num":20,"question":"A wire of resistance R is uniformly compressed such that its length is reduced to half while mass and density remain constant. The new resistance of the wire is:","options":["R / 2","R / 4","2 R","4 R"],"answer":"B"},{"id":21,"source_num":21,"question":"The electron configuration of the ion of element X in the compound X2O3 is [18Ar]. This element is located in:","options":["Period 3, Group 3A","Period 4, Group 3B","Period 4, Group 3A","Period 3, Group 5A"],"answer":"C"},{"id":22,"source_num":22,"question":"In the balanced redox equation: 2KMnO4 + 16HCl -> 2KCl + 2MnCl2 + 8H2O + 5Cl2, the number of moles of electrons lost by the reducing agent to produce 5 moles of Cl2 is:","options":["5 moles of electrons","10 moles of electrons","16 moles of electrons","2 moles of electrons"],"answer":"B"},{"id":23,"source_num":23,"question":"When excess zinc (Zn) is added to an aqueous mixture containing 1 mole of AgNO3 and 1 mole of Cu(NO3)2, the correct order of metal precipitation is:","options":["Cu precipitates completely first, then Ag","Ag precipitates completely first, then Cu","Both precipitate simultaneously at the same rate","Zinc reacts with nitrate ions without any metal precipitation"],"answer":"B"},{"id":24,"source_num":24,"question":"Heating 10 g of an impure sample of calcium carbonate CaCO3 released 2.2 g of CO2 gas (Molar mass of CaCO3 = 100 g/mol, CO2 = 44 g/mol). The percentage purity of CaCO3 in the sample is:","options":["22%","44%","50%","100%"],"answer":"C"},{"id":25,"source_num":25,"question":"In the decomposition reaction of hydrogen peroxide (2H2O2 -> 2H2O + O2), H2O2 acts as:","options":["An oxidizing agent only","A reducing agent only","Both an oxidizing agent and a reducing agent (disproportionation)","A catalyst"],"answer":"C"}],"english":[{"id":1,"source_num":1,"question":"By the time the team finished the research, they ________ hundreds of data samples.","options":["collected","have collected","had collected","collect"],"answer":"C"},{"id":2,"source_num":2,"question":"Select the synonym of \"Plausible\":","options":["Unlikely","Reasonable","Impossible","Complicated"],"answer":"B"},{"id":3,"source_num":3,"question":"Identify the sentence with correct punctuation:","options":["Although it was raining; we decided to go for a walk.","Although it was raining, we decided to go for a walk.","Although it was raining we decided, to go for a walk.","Although, it was raining we decided to go for a walk."],"answer":"B"},{"id":4,"source_num":4,"question":"The hypothesis must be thoroughly tested ________ it can be accepted as a scientific theory.","options":["unless","before","whereas","in spite of"],"answer":"B"},{"id":5,"source_num":5,"question":"Select the antonym of \"Ambiguous\":","options":["Vague","Obscure","Clear","Complex"],"answer":"C"},{"id":6,"source_num":6,"question":"Choose the correct passive form: \"The engineers are testing the new prototype today.\"","options":["The new prototype was tested today by the engineers.","The new prototype is being tested by the engineers today.","The new prototype has been tested today.","The new prototype is tested today."],"answer":"B"},{"id":7,"source_num":7,"question":"If the temperature ________ below freezing, the water expands.","options":["dropped","drops","will drop","would drop"],"answer":"B"},{"id":8,"source_num":8,"question":"The results of the experiment were ________ with the previous findings.","options":["consistent","consist","consistently","consistency"],"answer":"A"},{"id":9,"source_num":9,"question":"Identify the grammatically correct sentence:","options":["Neither the manager nor the employees was present.","Neither the manager nor the employees were present.","Neither the manager or the employees was present.","Neither the manager nor employees is present."],"answer":"B"},{"id":10,"source_num":10,"question":"Select const LETTERS=['A','B','C','D'];
const ARLETTERS=['أ','ب','ج','د'];
const SUBJECTS = {
  ar:[{key:'math',name:'رياضة',data:'math_ar'},{key:'science',name:'علوم',data:'science_ar'},{key:'english',name:'إنجليزي',data:'english'},{key:'iq',name:'IQ',data:'iq'}],
  en:[{key:'math',name:'Math',data:'math_en'},{key:'science',name:'Science',data:'science_en'},{key:'english',name:'English',data:'english'},{key:'iq',name:'IQ',data:'iq'}]
};
let state={screen:'home',name:'',phone:'',lang:null,order:[],subjectIndex:0,qIndex:0,answers:{},timeLeft:2400,timer:null,results:null};

const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem('stemexam_state',JSON.stringify(state))}
function getSubject(){return state.order[state.subjectIndex] || SUBJECTS[state.lang][state.subjectIndex]}
function getQuestions(){return DATA[getSubject().data]}
function render(){clearInterval(state.timer); app.innerHTML=(screens[state.screen]||screens.home)(); bind(); if(state.screen==='exam'){updateTimer(); startTimer();}}

function screensHome(){
return `<div class="screen home"><div class="hero"><div class="card login">
<div class="brand">امتحان القبول لمدارس المتفوقين للعلوم والتكنولوجيا</div><div class="title">STEM</div><div class="subtitle">امتحان القبول لمدارس المتفوقين للعلوم والتكنولوجيا</div>
<div class="field"><label>الاسم الثلاثي / Full Name</label><input id="name" value="${esc(state.name)}" placeholder="اكتب اسمك الثلاثي"></div>
<div class="field"><label>رقم الموبايل / Mobile</label><input id="phone" value="${esc(state.phone)}" placeholder="01xxxxxxxxx" inputmode="tel"></div>
<div class="actions"><button class="btn" id="startBtn">ابدأ الاختبار</button></div>
<div class="tiny">40 دقيقة لكل مادة • 25 سؤال للمواد الأساسية • 35 سؤال IQ</div>
</div></div></div>`}
function screensLang(){
return `<div class="screen"><div class="topbar"><div class="logo">STEM</div><div class="pill">${esc(state.name)} • ${esc(state.phone)}</div></div><div class="wrap">
<div class="pageTitle">اختار لغة الامتحان</div><div class="pageSub">الاختيار هيحدد لغة Math/Science وواجهة الاختبار.</div>
<div class="langGrid"><div class="card langCard ${state.lang==='ar'?'selected':''}" data-lang="ar"><div class="langIcon">🇪🇬</div><div class="langName">العربي</div><div class="muted">رياضة • علوم • إنجليزي • IQ</div></div>
<div class="card langCard ${state.lang==='en'?'selected':''}" data-lang="en"><div class="langIcon">🇬🇧</div><div class="langName">English</div><div class="muted">Math • Science • English • IQ</div></div></div>
<div class="actions"><button class="btn secondary" id="backHome">رجوع</button><button class="btn" id="toOrder" ${state.lang?'':'disabled'}>التالي</button></div></div></div>`}
function screensOrder(){
let list=state.order.map((s,i)=>`<div class="subjectItem" draggable="true" data-key="${s.key}"><span class="handle">⋮⋮</span><span class="orderNo">${i+1}</span><b>${s.name}</b><span class="muted">اسحب • أو استخدم الأسهم</span><button class="miniMove" data-up="${i}" type="button">↑</button><button class="miniMove" data-down="${i}" type="button">↓</button></div>`).join('');
return `<div class="screen"><div class="topbar"><div class="logo">STEM</div><div class="pill">${state.lang==='ar'?'العربي':'English'}</div></div><div class="wrap">
<div class="pageTitle">رتّب المواد</div><div class="pageSub">الترتيب الذي تختاره هو ترتيب الامتحان. كل مادة لها 40 دقيقة مستقلة.</div>
<div class="card" style="padding:18px"><div class="subjectList" id="subjectList">${list}</div></div>
<div class="notice">بعد الضغط على دخول الامتحان يبدأ المؤقت للمادة الأولى. بعد Submit لا يمكن الرجوع للمادة.</div>
<div class="actions"><button class="btn secondary" id="backLang">رجوع</button><button class="btn" id="enterExam">دخول الامتحان</button></div></div></div>`}
function screensExam(){
const qs=getQuestions(),q=qs[state.qIndex],answered=state.answers[state.subjectIndex]?.[state.qIndex];
const total=qs.length, pct=((state.qIndex+1)/total*100).toFixed(1);
const nums=qs.map((_,i)=>`<button class="qnum ${i===state.qIndex?'active':''} ${state.answers[state.subjectIndex]?.[i]?'done':''}" data-q="${i}">${i+1}</button>`).join('');
let body='';
if(getSubject().key==='iq'){
body=`<div class="iqLayout"><div><div class="qtext">${esc(q.question)}</div>${q.optionsImage?`<div class="optionsVisual"><img src="${q.optionsImage}" class="qimage optionGridImage" alt="صور الاختيارات"></div>`:''}<div class="options">${q.options.map((o,i)=>`<div class="option ${answered===LETTERS[i]?'selected':''}" data-answer="${LETTERS[i]}"><span class="letter">${LETTERS[i]}</span><span>${esc(o)}</span></div>`).join('')}</div></div>${q.image?`<div class="iqVisual"><div class="visualLabel">الشكل</div><img class="qimage" src="${q.image}" alt="شكل السؤال"></div>`:''}</div>`;
}else{
body=`<div class="qtext">${esc(q.question)}</div>${q.image?`<img class="qimage sideQuestionImage" src="${q.image}" alt="Question visual">`:''}<div class="options">${q.options.map((o,i)=>`<div class="option ${answered===LETTERS[i]?'selected':''}" data-answer="${LETTERS[i]}"><span class="letter">${state.lang==='ar'&&getSubject().key!=='english'?ARLETTERS[i]:LETTERS[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>`;
}
return `<div class="screen"><div class="topbar"><div class="logo">STEM</div><div><span class="pill">${esc(getSubject().name)}</span> <span class="pill">${state.subjectIndex+1}/4</span></div></div>
<div class="wrap examGrid"><aside class="card side"><div class="timer" id="timer">${fmtTime(state.timeLeft)}</div><div class="muted" style="text-align:center">المادة الحالية</div><div class="qnav">${nums}</div></aside>
<main class="card mainExam"><div class="examHead"><div><div class="subjectTag">${esc(getSubject().name)}</div><div class="muted">Question ${state.qIndex+1} / ${total}</div></div><div class="pill">${Math.round(pct)}%</div></div><div class="progress"><i style="width:${pct}%"></i></div>${body}
<div class="navrow"><button class="btn secondary" id="prevQ" ${state.qIndex===0?'disabled':''}>السابق</button><button class="btn" id="nextQ">${state.qIndex===total-1?'Submit المادة':'التالي'}</button></div></main></div></div>`}
function screensResults(){
const r=state.results||{}; const cards=state.order.map((s,i)=>`<div class="card scoreCard"><div class="muted">${esc(s.name)}</div><div class="score">${r.subjects?.[i]?.percent??0}%</div><div class="muted">${r.subjects?.[i]?.correct??0}/${r.subjects?.[i]?.total??0}</div></div>`).join('');
return `<div class="screen"><div class="wrap"><div class="topbar"><div class="logo">STEM</div><div class="pill">نتيجة الاختبار</div></div>
<div class="pageTitle">أحسنت يا ${esc(state.name)} 👑</div><div class="pageSub">تم إنهاء المواد الأربع.</div>
<div class="resultGrid">${cards}</div><div class="card total"><div class="muted">TOTAL SCORE</div><div class="score">${r.totalPercent??0}%</div><div class="muted">${r.totalCorrect??0} / ${r.totalQuestions??0} إجابة صحيحة</div></div>
<div class="actions"><button class="btn" id="finish">حفظ النتيجة والعودة</button></div></div></div>`}
const screens={home:screensHome,lang:screensLang,order:screensOrder,exam:screensExam,results:screensResults};

function bind(){
document.querySelectorAll('[data-lang]').forEach(x=>x.onclick=()=>{state.lang=x.dataset.lang;render()});
document.getElementById('startBtn')?.addEventListener('click',()=>{
 state.name=document.getElementById('name').value.trim();state.phone=document.getElementById('phone').value.trim();
 if(!state.name||!state.phone){alert('اكتب الاسم الثلاثي ورقم الموبايل');return}
 state.screen='lang';save();render();
});
document.getElementById('backHome')?.addEventListener('click',()=>{state.screen='home';render()});
document.getElementById('toOrder')?.addEventListener('click',()=>{state.order=SUBJECTS[state.lang].map(x=>({...x}));state.screen='order';save();render()});
document.getElementById('backLang')?.addEventListener('click',()=>{state.screen='lang';render()});
document.getElementById('enterExam')?.addEventListener('click',()=>{state.subjectIndex=0;state.qIndex=0;state.answers={};state.timeLeft=2400;state.screen='exam';save();render()});
document.querySelectorAll('.subjectItem').forEach(el=>{
 el.addEventListener('dragstart',e=>{el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.dataset.key)});
 el.addEventListener('dragend',()=>el.classList.remove('dragging'));
 el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});
 el.addEventListener('drop',e=>{
   e.preventDefault(); const fromKey=e.dataTransfer.getData('text/plain'), toKey=el.dataset.key;
   const from=state.order.findIndex(s=>s.key===fromKey), to=state.order.findIndex(s=>s.key===toKey);
   if(from<0||to<0||from===to)return;
   const arr=[...state.order],item=arr.splice(from,1)[0];arr.splice(to,0,item);state.order=arr;save();render();
 });
});
document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;if(i>0){let a=[...state.order];[a[i-1],a[i]]=[a[i],a[i-1]];state.order=a;save();render();}});
document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let i=+b.dataset.down;if(i<state.order.length-1){let a=[...state.order];[a[i+1],a[i]]=[a[i],a[i+1]];state.order=a;save();render();}});
document.querySelectorAll('.qnum').forEach(b=>b.onclick=()=>{state.qIndex=+b.dataset.q;save();render()});
document.querySelectorAll('.option').forEach(o=>o.onclick=()=>{state.answers[state.subjectIndex]??={};state.answers[state.subjectIndex][state.qIndex]=o.dataset.answer;save();render()});
document.getElementById('prevQ')?.addEventListener('click',()=>{state.qIndex--;render()});
document.getElementById('nextQ')?.addEventListener('click',()=>{if(state.qIndex<getQuestions().length-1){state.qIndex++;render()}else submitSubject()});
document.getElementById('finish')?.addEventListener('click',()=>{state.screen='home';state.results=null;save();render()});
}
function startTimer(){
clearInterval(state.timer);
state.timer=setInterval(()=>{state.timeLeft--;updateTimer();if(state.timeLeft<=0){clearInterval(state.timer);submitSubject(true)}},1000);
updateTimer();
}
function fmtTime(t){const m=Math.floor(t/60),s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function updateTimer(){const el=document.getElementById('timer');if(!el)return;el.textContent=fmtTime(state.timeLeft);el.classList.toggle('warn',state.timeLeft<300)}
function submitSubject(auto=false){
const qs=getQuestions(),ans=state.answers[state.subjectIndex]||{};let correct=0;
qs.forEach((q,i)=>{if(ans[i]===q.answer)correct++});
state.subjectResults??=[];state.subjectResults[state.subjectIndex]={correct,total:qs.length,percent:Math.round(correct/qs.length*1000)/10};
if(state.subjectIndex<3){state.subjectIndex++;state.qIndex=0;state.timeLeft=2400;save();render();if(auto)alert('انتهى وقت المادة، تم التسليم تلقائياً.');}
else{
 const subjects=state.subjectResults,totalQuestions=subjects.reduce((a,x)=>a+x.total,0),totalCorrect=subjects.reduce((a,x)=>a+x.correct,0);
 state.results={subjects,totalQuestions,totalCorrect,totalPercent:Math.round(totalCorrect/totalQuestions*1000)/10};
 const arr=JSON.parse(localStorage.getItem('stemexam_results')||'[]');arr.push({name:state.name,phone:state.phone,lang:state.lang==='ar'?'Arabic':'English',order:state.order.map(s=>s.name),subjects:state.results.subjects,totalPercent:state.results.totalPercent,totalCorrect:state.results.totalCorrect,totalQuestions:state.results.totalQuestions,date:new Date().toLocaleString()});localStorage.setItem('stemexam_results',JSON.stringify(arr));
 state.screen='results';save();render();
}
}
render();
</script>
</body>
</html>
